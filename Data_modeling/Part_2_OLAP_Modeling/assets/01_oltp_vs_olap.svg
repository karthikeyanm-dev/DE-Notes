<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>OLTP versus OLAP architecture</title>
<desc>Operational systems capture transactions; analytical systems integrate and analyze data for decisions.</desc>
<defs>
  <style>
    .bg{fill:#f7f9fc} .panel{fill:#ffffff;stroke:#d7dfeb;stroke-width:2}
    .ink{fill:#17243a} .muted{fill:#64748b}
    .h1{font:700 30px Arial,sans-serif;fill:#14213a}
    .h2{font:700 21px Arial,sans-serif;fill:#17243a}
    .body{font:17px Arial,sans-serif;fill:#334155}
    .small{font:15px Arial,sans-serif;fill:#64748b}
    .tiny{font:13px Arial,sans-serif;fill:#64748b}
    .white{fill:#fff} .line{stroke:#64748b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .blue{fill:#e7f0ff;stroke:#3b82f6;stroke-width:2} .green{fill:#e7f7ef;stroke:#16a34a;stroke-width:2}
    .amber{fill:#fff4d6;stroke:#d97706;stroke-width:2} .purple{fill:#f1eaff;stroke:#8b5cf6;stroke-width:2}
    .red{fill:#fff0f0;stroke:#dc6868;stroke-width:2}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<rect class="bg" width="1200" height="680" rx="22"/>
<text x="600" y="52" text-anchor="middle" class="h1">OLTP and OLAP: Different workloads, different designs</text>
<rect x="55" y="105" width="490" height="470" rx="18" class="panel"/>
<rect x="655" y="105" width="490" height="470" rx="18" class="panel"/>
<rect x="80" y="130" width="440" height="62" rx="12" class="blue"/>
<text x="300" y="169" text-anchor="middle" class="h2">OLTP · Run the business</text>
<rect x="680" y="130" width="440" height="62" rx="12" class="green"/>
<text x="900" y="169" text-anchor="middle" class="h2">OLAP · Understand the business</text>
<g class="body">
<text x="100" y="235">• Place an order</text><text x="100" y="275">• Update stock</text><text x="100" y="315">• Record a payment</text><text x="100" y="355">• Change a delivery status</text>
<text x="700" y="235">• Compare monthly sales</text><text x="700" y="275">• Find top-selling products</text><text x="700" y="315">• Analyze customer cohorts</text><text x="700" y="355">• Compare branch performance</text>
</g>
<rect x="95" y="405" width="410" height="115" rx="12" class="blue"/>
<text x="300" y="440" text-anchor="middle" class="h2">Operational database</text>
<text x="300" y="474" text-anchor="middle" class="small">Current records · frequent writes · short transactions</text>
<rect x="695" y="405" width="410" height="115" rx="12" class="green"/>
<text x="900" y="440" text-anchor="middle" class="h2">Analytical warehouse</text>
<text x="900" y="474" text-anchor="middle" class="small">Integrated history · scans and aggregations · reporting</text>
<path d="M545 300 H650" class="line" marker-end="url(#arrow)"/>
<text x="598" y="280" text-anchor="middle" class="tiny">ETL / ELT</text>
<text x="600" y="625" text-anchor="middle" class="small">E-commerce analogy: checkout counter versus the management analysis room</text>
</svg>