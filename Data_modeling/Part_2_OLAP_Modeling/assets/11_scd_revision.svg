<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>SCD Types – Quick Revision</title><desc>SCD defines how dimension attribute changes are represented</desc><style>
.bg{fill:#f7f9fc} .title{font:700 30px Arial;fill:#14213a} .sub{font:17px Arial;fill:#64748b}
.h{font:700 21px Arial;fill:#17243a} .t{font:17px Arial;fill:#334155} .foot{font:14px Arial;fill:#64748b}
</style><rect width="1200" height="680" rx="20" class="bg"/>
<text x="600" y="52" text-anchor="middle" class="title">SCD Types – Quick Revision</text>
<text x="600" y="83" text-anchor="middle" class="sub">SCD defines how dimension attribute changes are represented</text>
<rect x="65.0" y="125" width="510" height="430" rx="16" fill="#e7f0ff" stroke="#3b82f6" stroke-width="2"/>
<text x="89.0" y="165" class="h">Types 0, 1, 2</text>
<text x="90.0" y="207" class="t">• 0: retain original value</text>
<text x="90.0" y="238" class="t">• 1: overwrite old value</text>
<text x="90.0" y="269" class="t">• 2: add version row and preserve history</text>
<rect x="625.0" y="125" width="510" height="430" rx="16" fill="#e7f7ef" stroke="#16a34a" stroke-width="2"/>
<text x="649.0" y="165" class="h">Types 3, 4, 6</text>
<text x="650.0" y="207" class="t">• 3: retain limited previous value</text>
<text x="650.0" y="238" class="t">• 4: separate history table</text>
<text x="650.0" y="269" class="t">• 6: hybrid of Types 1, 2 and 3</text>
<text x="600" y="635" text-anchor="middle" class="foot">Part 4.2 · E-commerce dimensional modeling</text></svg>