<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>Measure Additivity</title><desc>How measures can and cannot be aggregated</desc><style>
.bg{fill:#f7f9fc} .title{font:700 30px Arial;fill:#14213a} .sub{font:17px Arial;fill:#64748b}
.h{font:700 21px Arial;fill:#17243a} .t{font:17px Arial;fill:#334155} .foot{font:14px Arial;fill:#64748b}
</style><rect width="1200" height="680" rx="20" class="bg"/>
<text x="600" y="52" text-anchor="middle" class="title">Measure Additivity</text>
<text x="600" y="83" text-anchor="middle" class="sub">How measures can and cannot be aggregated</text>
<rect x="65.0" y="125" width="510" height="215" rx="16" fill="#e7f0ff" stroke="#3b82f6" stroke-width="2"/>
<text x="89.0" y="165" class="h">Additive</text>
<text x="90.0" y="207" class="t">• Sales amount</text>
<text x="90.0" y="238" class="t">• Sum across date, product, store</text>
<text x="90.0" y="269" class="t">• ₹100 + ₹150 + ₹200 = ₹450</text>
<rect x="625.0" y="125" width="510" height="215" rx="16" fill="#e7f7ef" stroke="#16a34a" stroke-width="2"/>
<text x="649.0" y="165" class="h">Semi-additive</text>
<text x="650.0" y="207" class="t">• Inventory / account balance</text>
<text x="650.0" y="238" class="t">• Can sum across products at one date</text>
<text x="650.0" y="269" class="t">• Do not sum balances across dates</text>
<rect x="65.0" y="368" width="510" height="215" rx="16" fill="#fff4d6" stroke="#d97706" stroke-width="2"/>
<text x="89.0" y="408" class="h">Non-additive</text>
<text x="90.0" y="450" class="t">• Percentages, ratios, unit prices</text>
<text x="90.0" y="481" class="t">• Do not sum rates</text>
<text x="90.0" y="512" class="t">• Recalculate from numerator / denominator</text>
<text x="600" y="635" text-anchor="middle" class="foot">Part 4.2 · E-commerce dimensional modeling</text></svg>