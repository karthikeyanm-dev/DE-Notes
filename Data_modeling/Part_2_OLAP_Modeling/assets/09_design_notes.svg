<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<title>Important Schema Design Notes</title><desc>Avoid common misconceptions when designing dimensional schemas</desc>
<style>.bg{fill:#f7f9fc}.title{font:700 34px Arial;fill:#14213a}.sub{font:18px Arial;fill:#64748b}.h{font:700 20px Arial;fill:#17243a}.t{font:16px Arial;fill:#334155}.small{font:15px Arial;fill:#64748b}</style>
<rect width="1400" height="900" class="bg"/>
<text x="700" y="55" text-anchor="middle" class="title">Important Schema Design Notes</text>
<text x="700" y="88" text-anchor="middle" class="sub">Avoid common misconceptions when designing dimensional schemas</text>
<rect x="65" y="145" width="600" height="245" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="87" y="193" class="h">Star is not a physical layout</text><text x="90" y="255" class="t">• It is a logical relationship pattern.</text><text x="90" y="300" class="t">• Physical storage can differ.</text><rect x="725" y="145" width="600" height="245" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="747" y="193" class="h">Snowflake is not always faster</text><text x="750" y="255" class="t">• Normalization reduces repeated attributes.</text><text x="750" y="300" class="t">• Extra joins can add query work.</text><rect x="65" y="455" width="600" height="245" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="87" y="503" class="h">Galaxy is not one giant fact table</text><text x="90" y="565" class="t">• It contains multiple fact tables.</text><text x="90" y="610" class="t">• Shared dimensions connect processes.</text><rect x="725" y="455" width="600" height="245" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="747" y="503" class="h">Choose based on requirements</text><text x="750" y="565" class="t">• Consider grain, history and query patterns.</text><text x="750" y="610" class="t">• Do not choose by diagram appearance alone.</text>
<text x="700" y="865" text-anchor="middle" class="small">Part 4.3 · Dimensional Modeling</text></svg>