<rect x="40" y="150" width="410" height="570" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="245" y="210" text-anchor="middle" class="h">STAR</text><text x="245" y="250" text-anchor="middle" class="small">Denormalized dimensions</text><rect x="75" y="315" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="245" y="358" text-anchor="middle" class="t">One fact → direct dimensions</text><rect x="75" y="425" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="245" y="468" text-anchor="middle" class="t">Fewer joins</text><rect x="75" y="535" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="245" y="578" text-anchor="middle" class="t">Simple reporting</text><rect x="495" y="150" width="410" height="570" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="700" y="210" text-anchor="middle" class="h">SNOWFLAKE</text><text x="700" y="250" text-anchor="middle" class="small">Normalized dimensions</text><rect x="530" y="315" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="700" y="358" text-anchor="middle" class="t">Fact → dimension hierarchy</text><rect x="530" y="425" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="700" y="468" text-anchor="middle" class="t">More joins</text><rect x="530" y="535" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="700" y="578" text-anchor="middle" class="t">Shared hierarchy attributes</text><rect x="950" y="150" width="410" height="570" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1155" y="210" text-anchor="middle" class="h">GALAXY</text><text x="1155" y="250" text-anchor="middle" class="small">Multiple fact tables</text><rect x="985" y="315" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="1155" y="358" text-anchor="middle" class="t">Sales + Returns + Inventory</text><rect x="985" y="425" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="1155" y="468" text-anchor="middle" class="t">Shared dimensions</text><rect x="985" y="535" width="340" height="72" rx="10" fill="#e8f1ff" stroke="#94a3b8"/><text x="1155" y="578" text-anchor="middle" class="t">Enterprise analytics</text>
