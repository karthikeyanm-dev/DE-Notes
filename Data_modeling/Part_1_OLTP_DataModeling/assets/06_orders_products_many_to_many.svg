<g font-family="Arial" fill="#0f172a" text-anchor="middle">
<text x="600" y="305" font-size="23" font-weight="700">M : N</text>
<text x="600" y="445" font-size="19">One order can contain many products.</text>
<text x="600" y="480" font-size="19">One product can appear in many orders.</text>
<text x="600" y="555" font-size="17" fill="#475569">A direct many-to-many relationship is conceptual; relational tables need an associative entity.</text>
</g>
