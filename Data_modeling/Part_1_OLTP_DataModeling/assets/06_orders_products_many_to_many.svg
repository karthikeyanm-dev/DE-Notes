<text x="600.0" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Orders and Products – Many-to-Many</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">The business rule creates an M:N relationship.</text>
