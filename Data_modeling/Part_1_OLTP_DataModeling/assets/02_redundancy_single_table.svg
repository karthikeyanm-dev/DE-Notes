<text x="90" y="145">Order ID</text><text x="235" y="145">Customer ID</text><text x="405" y="145">Customer Name</text><text x="625" y="145">Phone</text><text x="830" y="145">Product</text></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#0f172a">
<text x="100" y="220">101</text><text x="250" y="220">C01</text><text x="430" y="220">Gopal</text><text x="625" y="220">9876543210</text><text x="830" y="220">Phone</text>
<text x="100" y="290">102</text><text x="250" y="290">C01</text><text x="430" y="290">Gopal</text><text x="625" y="290">9876543210</text><text x="830" y="290">TV</text>
<text x="100" y="360">103</text><text x="250" y="360">C01</text><text x="430" y="360">Gopal</text><text x="625" y="360">9876543210</text><text x="830" y="360">TWS</text></g>
