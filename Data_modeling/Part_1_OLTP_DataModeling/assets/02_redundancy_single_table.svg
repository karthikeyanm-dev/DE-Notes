<text x="500" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b91c1c">Customer details repeat for every order.</text>
<text x="500" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Repeated values can cause update, insertion and deletion anomalies.</text>
