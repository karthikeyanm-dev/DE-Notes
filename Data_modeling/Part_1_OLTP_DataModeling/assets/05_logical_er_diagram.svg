<text x="500" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#334155">One customer can place many orders.</text>
<text x="500" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">ORDERS.customer_id references CUSTOMER.customer_id.</text>
