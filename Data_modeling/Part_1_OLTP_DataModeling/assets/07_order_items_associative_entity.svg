<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" rx="24" fill="#f8fafc"/>
<text x="600.0" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Resolve M:N with an Associative Entity</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Order Items stores each product line belonging to an order.</text>
<rect x="45" y="235" width="300" height="235" rx="12" fill="#fff" stroke="#d97706" stroke-width="2.5"/><rect x="45" y="235" width="300" height="52" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="195.0" y="269" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">ORDERS</text><text x="67" y="323" font-family="Arial" font-size="17" fill="#334155">PK  order_id</text><rect x="450" y="235" width="300" height="300" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><rect x="450" y="235" width="300" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="600.0" y="269" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">ORDER_ITEMS</text><text x="472" y="323" font-family="Arial" font-size="17" fill="#334155">PK  order_item_id</text><text x="472" y="355" font-family="Arial" font-size="17" fill="#334155">FK  order_id</text><text x="472" y="387" font-family="Arial" font-size="17" fill="#334155">FK  product_id</text><text x="472" y="419" font-family="Arial" font-size="17" fill="#334155">quantity</text><text x="472" y="451" font-family="Arial" font-size="17" fill="#334155">unit_price</text><rect x="855" y="235" width="300" height="235" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/><rect x="855" y="235" width="300" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="1005.0" y="269" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">PRODUCTS</text><text x="877" y="323" font-family="Arial" font-size="17" fill="#334155">PK  product_id</text>
<g stroke="#334155" stroke-width="3" fill="none">
<path d="M345 355H450"/><path d="M750 355H855"/>
<!-- parent side exactly one per item; child side one or many items per parent -->
<path d="M365 335V375 M377 335V375"/>
<path d="M430 355L405 330 M430 355L405 355 M430 355L405 380"/>
<path d="M770 355L795 330 M770 355L795 355 M770 355L795 380"/>
<path d="M823 335V375 M835 335V375"/>
</g>
<g font-family="Arial" fill="#0f172a" text-anchor="middle">
<text x="397" y="305" font-size="17" font-weight="700">1 : M</text>
<text x="800" y="305" font-size="17" font-weight="700">M : 1</text>
<text x="600" y="590" font-size="20" font-weight="700">Order 1 → many Order Items; Product 1 → many Order Items</text>
<text x="600" y="625" font-size="17" fill="#475569">Order Items resolves the original Orders ↔ Products M:N relationship.</text>
</g>
</svg>