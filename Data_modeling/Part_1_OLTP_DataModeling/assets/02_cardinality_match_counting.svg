<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" rx="24" fill="#f8fafc"/>
<text x="600.0" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Cardinality – Count the Matches</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">A practical set/matching analogy for minimum and maximum participation.</text>

<g font-family="Arial">
<rect x="70" y="125" width="1060" height="490" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="175" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Think of cardinality as counting matches for each record</text>
<rect x="130" y="225" width="270" height="300" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="265" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">Orders</text>
<g fill="#92400e" font-size="19" text-anchor="middle">
<circle cx="205" cy="325" r="22" fill="#fde68a" stroke="#d97706"/><text x="205" y="332">O1</text>
<circle cx="265" cy="325" r="22" fill="#fde68a" stroke="#d97706"/><text x="265" y="332">O2</text>
<circle cx="325" cy="325" r="22" fill="#fde68a" stroke="#d97706"/><text x="325" y="332">O3</text>
<text x="265" y="410" font-size="17">For each order,</text><text x="265" y="440" font-size="17">count matching</text><text x="265" y="470" font-size="17">customers.</text>
</g>
<rect x="800" y="225" width="270" height="300" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="935" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Customers</text>
<g fill="#166534" font-size="19" text-anchor="middle">
<circle cx="875" cy="325" r="22" fill="#bbf7d0" stroke="#16a34a"/><text x="875" y="332">C1</text>
<circle cx="935" cy="325" r="22" fill="#bbf7d0" stroke="#16a34a"/><text x="935" y="332">C2</text>
<circle cx="995" cy="325" r="22" fill="#bbf7d0" stroke="#16a34a"/><text x="995" y="332">C3</text>
<text x="935" y="410" font-size="17">A customer can</text><text x="935" y="440" font-size="17">match many</text><text x="935" y="470" font-size="17">orders.</text>
</g>
<g stroke="#64748b" stroke-width="3" fill="none">
<path d="M400 325H800"/><path d="M400 325L790 325" stroke-dasharray="8 8"/>
<path d="M400 355L800 355" stroke-dasharray="8 8"/>
</g>
<text x="600" y="295" text-anchor="middle" font-size="18" fill="#334155">Match by customer_id</text>
<text x="600" y="390" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Order → exactly 1 Customer</text>
<text x="600" y="430" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Customer → 0..many Orders</text>
<text x="600" y="570" text-anchor="middle" font-size="16" fill="#64748b">This is a match-counting analogy, not a literal Venn diagram.</text>
</g>
</svg>