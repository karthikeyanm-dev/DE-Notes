<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="560" rx="24" fill="#f8fafc"/>
<text x="500" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0f172a">Separate Customer and Orders Tables</text>
<g font-family="Arial,sans-serif">
<rect x="75" y="125" width="355" height="280" rx="16" fill="#fff" stroke="#0d9488" stroke-width="3"/><rect x="75" y="125" width="355" height="62" rx="13" fill="#ccfbf1"/><text x="252" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#115e59">CUSTOMERS</text>
<g font-size="21" fill="#0f172a"><text x="115" y="245">customer_id (PK)</text><text x="115" y="300">customer_name</text><text x="115" y="355">phone</text></g>
<rect x="570" y="125" width="355" height="280" rx="16" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="570" y="125" width="355" height="62" rx="13" fill="#dbeafe"/><text x="747" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#1e40af">ORDERS</text>
<g font-size="21" fill="#0f172a"><text x="610" y="245">order_id (PK)</text><text x="610" y="300">customer_id (FK)</text><text x="610" y="355">product</text></g>
<path d="M430 270H570" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="245" text-anchor="middle" font-size="17" fill="#334155">1 : many</text>
</g>
<text x="500" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f766e">Customer details are stored once and referenced by customer_id.</text>
<text x="500" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">A normalized structure reduces unnecessary duplication in transactional systems.</text>
</svg>