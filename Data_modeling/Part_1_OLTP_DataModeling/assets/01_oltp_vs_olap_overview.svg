<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="24" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#0f172a">OLTP vs OLAP</text><rect x="55" y="105" width="425" height="340" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="520" y="105" width="425" height="340" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/><g font-family="Arial" text-anchor="middle"><text x="267" y="160" font-size="30" font-weight="bold" fill="#1d4ed8">OLTP</text><text x="267" y="195" font-size="18" fill="#1e40af">Online Transaction Processing</text><text x="732" y="160" font-size="30" font-weight="bold" fill="#0f766e">OLAP</text><text x="732" y="195" font-size="18" fill="#115e59">Online Analytical Processing</text></g><g font-family="Arial" font-size="20" fill="#1e3a8a"><text x="105" y="260">• Place an order</text><text x="105" y="305">• Update a customer</text><text x="105" y="350">• Process a payment</text><text x="105" y="395">• Update inventory</text></g><g font-family="Arial" font-size="20" fill="#115e59"><text x="570" y="260">• Calculate monthly revenue</text><text x="570" y="305">• Find top-selling products</text><text x="570" y="350">• Compare yearly sales</text><text x="570" y="395">• Analyze customer trends</text></g><text x="500" y="485" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">OLTP runs business operations; OLAP helps analyze business performance.</text></svg>