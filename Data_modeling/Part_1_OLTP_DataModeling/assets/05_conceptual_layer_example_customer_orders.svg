<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs>
<rect width="1100" height="650" rx="24" fill="#f8fafc"/>
<text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Conceptual Example – E-commerce Business</text>
<rect x="85" y="135" width="280" height="165" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="225" y="185" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#1e40af">CUSTOMER</text>
<text x="225" y="230" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e3a8a">A person who buys</text>
<text x="225" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#1e3a8a">products</text>
<rect x="735" y="135" width="280" height="165" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="875" y="185" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#166534">ORDER</text>
<text x="875" y="230" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">A purchase request</text>
<text x="875" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#166534">made by a customer</text>
<path d="M365 215H725" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="545" y="190" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#334155">places</text>
<rect x="85" y="380" width="930" height="170" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="550" y="425" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Questions still to validate with the business</text>
<g font-family="Arial" font-size="18" fill="#334155">
<text x="145" y="470">• Can a customer place multiple orders?</text>
<text x="145" y="510">• Can an order contain multiple products?</text>
<text x="600" y="470">• What customer details must be captured?</text>
<text x="600" y="510">• What order information must be tracked?</text>
</g>
<text x="550" y="600" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">This is a business-level view, not a finalized relational schema or ER diagram.</text>
</svg>