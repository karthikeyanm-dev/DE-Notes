<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" rx="24" fill="#f8fafc"/>
<text x="600.0" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Crow's Foot Notation – Minimum and Maximum</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Read each endpoint as a minimum and maximum number of matching records.</text>

<g font-family="Arial" fill="#0f172a">
<rect x="80" y="125" width="1040" height="475" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="130" y="175" font-size="23" font-weight="700">Crow's Foot endpoint symbols</text>
<!-- zero -->
<circle cx="210" cy="265" r="12" fill="none" stroke="#0f766e" stroke-width="4"/>
<text x="260" y="273" font-size="24" font-weight="700">0 = optional</text>
<text x="490" y="273" font-size="19" fill="#475569">The minimum participation is zero.</text>
<!-- one -->
<path d="M205 340V390 M190 340H220" stroke="#2563eb" stroke-width="4"/>
<text x="260" y="372" font-size="24" font-weight="700">1 = exactly one / mandatory</text>
<text x="650" y="372" font-size="19" fill="#475569">A single bar means one.</text>
<!-- many -->
<path d="M210 455L175 425 M210 455L210 415 M210 455L245 425" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="260" y="462" font-size="24" font-weight="700">Many = crow's foot</text>
<text x="570" y="462" font-size="19" fill="#475569">Three branches mean many (one or more only if paired with a bar).</text>
<text x="130" y="545" font-size="19" fill="#334155">Combine symbols to express minimum and maximum participation:</text>
<text x="160" y="585" font-size="20" font-weight="700" fill="#0f766e">O| = zero or one</text>
<text x="450" y="585" font-size="20" font-weight="700" fill="#2563eb">|| = exactly one</text>
<text x="730" y="585" font-size="20" font-weight="700" fill="#7c3aed">O&lt; = zero or many</text>
<text x="990" y="585" font-size="20" font-weight="700" fill="#9a3412">|&lt; = one or many</text>
</g>
</svg>