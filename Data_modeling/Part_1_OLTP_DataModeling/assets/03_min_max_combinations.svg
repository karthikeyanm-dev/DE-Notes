<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" rx="24" fill="#f8fafc"/>
<text x="600.0" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Minimum and Maximum Cardinality</text>
<text x="600.0" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Combine optionality and multiplicity to describe a relationship.</text>

<g font-family="Arial">
<rect x="70" y="125" width="1060" height="490" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="120" y="175" font-size="22" font-weight="700" fill="#0f172a">Four common endpoint combinations</text>
<g font-size="20" fill="#334155">
<text x="145" y="250" font-weight="700">O|</text><text x="260" y="250">Zero or one</text><text x="610" y="250">Optional, maximum one</text>
<text x="145" y="330" font-weight="700">||</text><text x="260" y="330">Exactly one</text><text x="610" y="330">Mandatory, maximum one</text>
<text x="145" y="410" font-weight="700">O&lt;</text><text x="260" y="410">Zero or many</text><text x="610" y="410">Optional, no fixed upper limit</text>
<text x="145" y="490" font-weight="700">|&lt;</text><text x="260" y="490">One or many</text><text x="610" y="490">Mandatory, one or more</text>
</g>
<g stroke="#64748b" stroke-width="2"><path d="M120 275H1080 M120 355H1080 M120 435H1080"/></g>
<text x="120" y="565" font-size="17" fill="#64748b">The circle indicates minimum = 0; the bar indicates minimum = 1 / exactly one; the crow's foot indicates maximum = many.</text>
</g>
</svg>