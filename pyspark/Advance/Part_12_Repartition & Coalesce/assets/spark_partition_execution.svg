iddle" class="s">Task 4</text><path d="M875 407 V450" class="line"/><rect x="800" y="450" width="150" height="62" rx="9" class="part"/><text x="875" y="488" text-anchor="middle" class="t">P3</text><text x="500" y="560" text-anchor="middle" class="s">One task processes one partition in a given stage</text><text x="500" y="588" text-anchor="middle" class="small">Actual task placement and concurrency depend on available task slots and scheduling.</text></svg>