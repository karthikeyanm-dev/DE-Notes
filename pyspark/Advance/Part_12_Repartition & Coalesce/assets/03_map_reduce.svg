<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <style>
    .title{font: bold 28px Arial; fill:#0f172a} .h{font:bold 19px Arial;fill:#0f172a}
    .t{font:16px Arial;fill:#1e293b} .s{font:14px Arial;fill:#475569}
    .b{stroke:#334155;stroke-width:2;rx:14} .a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" class="title">Map-side combine versus reduce-side aggregation</text>
<rect x="35" y="105" width="330" height="365" fill="#eff6ff" class="b"/><text x="60" y="145" class="h">Map-side input partitions</text>
<text x="65" y="200" class="t">P0: A=10, B=5, A=7</text><text x="65" y="245" class="t">P1: A=3, B=8, A=2</text><text x="65" y="290" class="t">P2: B=4, A=6</text>
<path d="M380 285 L470 285" class="a"/>
<rect x="490" y="105" width="300" height="365" fill="#fef3c7" class="b"/><text x="515" y="145" class="h">Local combine</text>
<text x="520" y="205" class="t">P0 → A=17, B=5</text><text x="520" y="250" class="t">P1 → A=5, B=8</text><text x="520" y="295" class="t">P2 → A=6, B=4</text><text x="520" y="375" class="s">Less data may cross the network</text>
<path d="M805 285 L895 285" class="a"/>
<rect x="915" y="105" width="250" height="365" fill="#dcfce7" class="b"/><text x="940" y="145" class="h">Reduce-side result</text>
<text x="945" y="220" class="t">A = 28</text><text x="945" y="270" class="t">B = 17</text><text x="945" y="365" class="s">All values for a key meet</text>
</svg>