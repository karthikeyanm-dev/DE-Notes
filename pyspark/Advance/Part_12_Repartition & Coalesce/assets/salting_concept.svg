<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<style>.title{font:bold 25px Arial;fill:#172033}.h{font:bold 19px Arial;fill:#1e293b}.t{font:16px Arial;fill:#334155}.before{fill:#ffedd5;stroke:#d97706;stroke-width:2}.after{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style>
<rect width="1000" height="560" fill="white"/><text x="500" y="45" text-anchor="middle" class="title">Salting: conceptual distribution of a hot key</text>
<text x="250" y="105" text-anchor="middle" class="h">Before salting</text><rect x="120" y="135" width="260" height="100" rx="12" class="before"/><text x="250" y="175" text-anchor="middle" class="h">Customer C001</text><text x="250" y="210" text-anchor="middle" class="t">800,000 records</text>
<rect x="120" y="285" width="260" height="75" rx="12" class="before"/><text x="250" y="330" text-anchor="middle" class="h">One hot partition</text>
<text x="750" y="105" text-anchor="middle" class="h">After adding salt buckets</text><rect x="620" y="135" width="260" height="75" rx="12" class="after"/><text x="750" y="180" text-anchor="middle" class="h">C001 + salt value</text>
<rect x="610" y="285" width="65" height="85" rx="8" class="after"/><text x="642" y="320" text-anchor="middle" class="h">0</text><text x="642" y="348" text-anchor="middle" class="t">salt</text><rect x="685" y="285" width="65" height="85" rx="8" class="after"/><text x="717" y="320" text-anchor="middle" class="h">1</text><text x="717" y="348" text-anchor="middle" class="t">salt</text><rect x="760" y="285" width="65" height="85" rx="8" class="after"/><text x="792" y="320" text-anchor="middle" class="h">2</text><text x="792" y="348" text-anchor="middle" class="t">salt</text><rect x="835" y="285" width="65" height="85" rx="8" class="after"/><text x="867" y="320" text-anchor="middle" class="h">3</text><text x="867" y="348" text-anchor="middle" class="t">salt</text><path d="M750 210 V245 M642 245 H867 M642 245 V285 M717 245 V285 M792 245 V285 M867 245 V285" stroke="#64748b" stroke-width="2" fill="none"/><text x="500" y="435" text-anchor="middle" class="t">Work can be spread across salted keys.</text><text x="500" y="475" text-anchor="middle" class="t">Joins need consistent salting or replication of matching keys.</text><text x="500" y="515" text-anchor="middle" class="t">A final aggregation may be needed to combine partial results.</text></svg>