<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <style>
    .title{font: bold 28px Arial; fill:#0f172a} .h{font:bold 19px Arial;fill:#0f172a}
    .t{font:16px Arial;fill:#1e293b} .s{font:14px Arial;fill:#475569}
    .b{stroke:#334155;stroke-width:2;rx:14} .a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" class="title">Why does Spark need a shuffle?</text>
<rect x="40" y="100" width="300" height="370" fill="#eff6ff" class="b"/>
<text x="65" y="138" class="h">Input partitions</text>
<rect x="70" y="165" width="240" height="75" fill="#dbeafe" class="b"/><text x="90" y="195" class="t">P0: Chennai, Mumbai</text><text x="90" y="220" class="s">Chennai 100 · Mumbai 50</text>
<rect x="70" y="260" width="240" height="75" fill="#dbeafe" class="b"/><text x="90" y="290" class="t">P1: Delhi, Chennai</text><text x="90" y="315" class="s">Delhi 80 · Chennai 40</text>
<rect x="70" y="355" width="240" height="75" fill="#dbeafe" class="b"/><text x="90" y="385" class="t">P2: Mumbai, Delhi</text><text x="90" y="410" class="s">Mumbai 70 · Delhi 20</text>
<path d="M355 280 L485 280" class="a"/><text x="365" y="250" class="s">groupBy(city)</text>
<rect x="505" y="100" width="260" height="370" fill="#fef3c7" class="b"/><text x="530" y="138" class="h">Redistribute by key</text>
<rect x="535" y="175" width="200" height="65" fill="#fde68a" class="b"/><text x="555" y="214" class="t">All Chennai rows</text>
<rect x="535" y="270" width="200" height="65" fill="#fde68a" class="b"/><text x="555" y="309" class="t">All Mumbai rows</text>
<rect x="535" y="365" width="200" height="65" fill="#fde68a" class="b"/><text x="555" y="404" class="t">All Delhi rows</text>
<path d="M780 280 L900 280" class="a"/>
<rect x="920" y="155" width="240" height="250" fill="#dcfce7" class="b"/><text x="945" y="193" class="h">Grouped output</text>
<text x="945" y="245" class="t">Chennai = 140</text><text x="945" y="295" class="t">Mumbai = 120</text><text x="945" y="345" class="t">Delhi = 100</text>
</svg>