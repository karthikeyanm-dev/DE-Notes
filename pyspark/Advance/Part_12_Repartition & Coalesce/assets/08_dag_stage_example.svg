<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
 <style>
 .title{font:bold 28px Arial;fill:#0f172a} .head{font:bold 19px Arial;fill:#0f172a}
 .txt{font:16px Arial;fill:#1e293b} .small{font:14px Arial;fill:#475569}
 .box{stroke:#334155;stroke-width:2;rx:13} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title">Example DAG: narrow chain followed by wide dependency</text>

<rect x="35" y="130" width="190" height="90" fill="#dbeafe" class="box"/><text x="75" y="165" class="head">Read</text><text x="75" y="195" class="small">Stage 0</text>
<path d="M230 175 L300 175" class="arrow"/><rect x="320" y="130" width="190" height="90" fill="#dcfce7" class="box"/><text x="355" y="165" class="head">map/filter</text><text x="355" y="195" class="small">Narrow</text>
<path d="M515 175 L585 175" class="arrow"/><rect x="605" y="130" width="190" height="90" fill="#fef3c7" class="box"/><text x="640" y="165" class="head">Shuffle</text><text x="640" y="195" class="small">Boundary</text>
<path d="M800 175 L870 175" class="arrow"/><rect x="890" y="130" width="270" height="90" fill="#dcfce7" class="box"/><text x="930" y="165" class="head">aggregate/write</text><text x="930" y="195" class="small">Stage 1</text>
<text x="50" y="330" class="txt">A Spark job can contain multiple stages. Narrow operations are pipelined within a stage;</text><text x="50" y="365" class="txt">shuffle dependencies normally separate stages so downstream tasks can fetch completed map outputs.</text>

</svg>