<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
 <style>
 .title{font:bold 28px Arial;fill:#0f172a} .head{font:bold 19px Arial;fill:#0f172a}
 .txt{font:16px Arial;fill:#1e293b} .small{font:14px Arial;fill:#475569}
 .box{stroke:#334155;stroke-width:2;rx:13} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title">Wide dependency: records move across partitions</text>

<rect x="35" y="110" width="280" height="360" fill="#eff6ff" class="box"/><text x="65" y="150" class="head">Parent partitions</text>
<rect x="70" y="185" width="210" height="65" fill="#bfdbfe" class="box"/><text x="95" y="225" class="txt">P0: A, B, A</text>
<rect x="70" y="275" width="210" height="65" fill="#bfdbfe" class="box"/><text x="95" y="315" class="txt">P1: B, C, A</text>
<rect x="70" y="365" width="210" height="65" fill="#bfdbfe" class="box"/><text x="95" y="405" class="txt">P2: C, B, C</text>
<path d="M325 217 L430 270 M325 307 L430 270 M325 397 L430 270" class="arrow"/>
<rect x="450" y="170" width="280" height="200" fill="#fef3c7" class="box"/><text x="485" y="215" class="head">Shuffle / redistribution</text><text x="485" y="265" class="txt">Partition by key</text><text x="485" y="305" class="txt">Transfer blocks</text>
<path d="M740 270 L825 217 M740 270 L825 307 M740 270 L825 397" class="arrow"/>
<rect x="845" y="110" width="310" height="360" fill="#dcfce7" class="box"/><text x="875" y="150" class="head">Child partitions</text>
<rect x="885" y="185" width="230" height="65" fill="#bbf7d0" class="box"/><text x="910" y="225" class="txt">P0: all A values</text>
<rect x="885" y="275" width="230" height="65" fill="#bbf7d0" class="box"/><text x="910" y="315" class="txt">P1: all B values</text>
<rect x="885" y="365" width="230" height="65" fill="#bbf7d0" class="box"/><text x="910" y="405" class="txt">P2: all C values</text>

</svg>