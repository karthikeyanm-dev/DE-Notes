<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<style>.title{font:bold 26px Arial;fill:#172033}.h{font:bold 19px Arial;fill:#1e293b}.t{font:16px Arial;fill:#334155}.bg{fill:#e2e8f0}.green{fill:#16a34a}.orange{fill:#d97706}</style>
<rect width="1000" height="560" fill="white"/><text x="500" y="45" text-anchor="middle" class="title">Balanced vs. skewed partition distribution</text>
<text x="250" y="100" text-anchor="middle" class="h">Balanced: 25 each</text><text x="750" y="100" text-anchor="middle" class="h">Skewed: 70 in one partition</text>
<text x="40" y="160" class="t">P0</text><rect x="90" y="135" width="300" height="35" rx="6" class="bg"/><rect x="90" y="135" width="75" height="35" rx="6" class="green"/><text x="405" y="160" class="t">25</text><text x="40" y="235" class="t">P1</text><rect x="90" y="210" width="300" height="35" rx="6" class="bg"/><rect x="90" y="210" width="75" height="35" rx="6" class="green"/><text x="405" y="235" class="t">25</text><text x="40" y="310" class="t">P2</text><rect x="90" y="285" width="300" height="35" rx="6" class="bg"/><rect x="90" y="285" width="75" height="35" rx="6" class="green"/><text x="405" y="310" class="t">25</text><text x="40" y="385" class="t">P3</text><rect x="90" y="360" width="300" height="35" rx="6" class="bg"/><rect x="90" y="360" width="75" height="35" rx="6" class="green"/><text x="405" y="385" class="t">25</text><text x="530" y="160" class="t">P0</text><rect x="580" y="135" width="300" height="35" rx="6" class="bg"/><rect x="580" y="135" width="30" height="35" rx="6" class="green"/><text x="895" y="160" class="t">10</text><text x="530" y="235" class="t">P1</text><rect x="580" y="210" width="300" height="35" rx="6" class="bg"/><rect x="580" y="210" width="30" height="35" rx="6" class="green"/><text x="895" y="235" class="t">10</text><text x="530" y="310" class="t">P2</text><rect x="580" y="285" width="300" height="35" rx="6" class="bg"/><rect x="580" y="285" width="30" height="35" rx="6" class="green"/><text x="895" y="310" class="t">10</text><text x="530" y="385" class="t">P3</text><rect x="580" y="360" width="300" height="35" rx="6" class="bg"/><rect x="580" y="360" width="210" height="35" rx="6" class="orange"/><text x="895" y="385" class="t">70</text><text x="500" y="490" text-anchor="middle" class="t">Uneven data or workload can leave one task running much longer.</text></svg>