<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<defs><style>.title{font:bold 25px Arial;fill:#172033}.label{font:bold 20px Arial;fill:#1e293b}.data{font:18px Arial;fill:#334155}.box{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none}</style></defs>
<rect width="1000" height="520" fill="white"/>
<text x="500" y="45" text-anchor="middle" class="title">How glom() groups records by partition</text>
<text x="500" y="95" text-anchor="middle" class="label">RDD before glom()</text>
<rect x="45" y="120" width="210" height="95" rx="12" class="box"/><text x="150" y="155" text-anchor="middle" class="label">Partition 0</text><text x="150" y="190" text-anchor="middle" class="data">10, 20</text><rect x="285" y="120" width="210" height="95" rx="12" class="box"/><text x="390" y="155" text-anchor="middle" class="label">Partition 1</text><text x="390" y="190" text-anchor="middle" class="data">30, 40</text><rect x="525" y="120" width="210" height="95" rx="12" class="box"/><text x="630" y="155" text-anchor="middle" class="label">Partition 2</text><text x="630" y="190" text-anchor="middle" class="data">50, 60</text><rect x="765" y="120" width="210" height="95" rx="12" class="box"/><text x="870" y="155" text-anchor="middle" class="label">Partition 3</text><text x="870" y="190" text-anchor="middle" class="data">70, 80</text><path d="M500 235 V285" class="arrow"/><path d="M490 275 L500 288 L510 275" class="arrow"/><text x="500" y="320" text-anchor="middle" class="label">After glom(): one list per partition</text><rect x="45" y="350" width="210" height="95" rx="12" class="green"/><text x="150" y="385" text-anchor="middle" class="label">Partition 0</text><text x="150" y="420" text-anchor="middle" class="data">[10, 20]</text><rect x="285" y="350" width="210" height="95" rx="12" class="green"/><text x="390" y="385" text-anchor="middle" class="label">Partition 1</text><text x="390" y="420" text-anchor="middle" class="data">[30, 40]</text><rect x="525" y="350" width="210" height="95" rx="12" class="green"/><text x="630" y="385" text-anchor="middle" class="label">Partition 2</text><text x="630" y="420" text-anchor="middle" class="data">[50, 60]</text><rect x="765" y="350" width="210" height="95" rx="12" class="green"/><text x="870" y="385" text-anchor="middle" class="label">Partition 3</text><text x="870" y="420" text-anchor="middle" class="data">[70, 80]</text></svg>