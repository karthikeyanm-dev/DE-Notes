<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
 <style>
 .title{font:bold 28px Arial;fill:#0f172a} .head{font:bold 19px Arial;fill:#0f172a}
 .txt{font:16px Arial;fill:#1e293b} .small{font:14px Arial;fill:#475569}
 .box{stroke:#334155;stroke-width:2;rx:13} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title">RDD lineage: transformations form a dependency graph</text>

<rect x="55" y="220" width="190" height="90" fill="#dbeafe" class="box"/><text x="90" y="255" class="head">Source RDD</text><text x="90" y="285" class="small">textFile()</text>
<path d="M250 265 L350 265" class="arrow"/><rect x="370" y="220" width="190" height="90" fill="#dcfce7" class="box"/><text x="410" y="255" class="head">Mapped RDD</text><text x="410" y="285" class="small">map()</text>
<path d="M565 265 L665 265" class="arrow"/><rect x="685" y="220" width="190" height="90" fill="#dcfce7" class="box"/><text x="725" y="255" class="head">Filtered RDD</text><text x="725" y="285" class="small">filter()</text>
<path d="M880 265 L980 265" class="arrow"/><rect x="1000" y="220" width="150" height="90" fill="#fef3c7" class="box"/><text x="1020" y="255" class="head">Action</text><text x="1020" y="285" class="small">count()</text>
<text x="70" y="390" class="txt">Lineage records how each RDD is derived; Spark can use it to recompute lost partitions.</text>

</svg>