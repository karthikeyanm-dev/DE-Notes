<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
 <style>
 .title{font:bold 28px Arial;fill:#0f172a} .head{font:bold 19px Arial;fill:#0f172a}
 .txt{font:16px Arial;fill:#1e293b} .small{font:14px Arial;fill:#475569}
 .box{stroke:#334155;stroke-width:2;rx:13} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title">Narrow dependency: partition-local processing</text>

<rect x="45" y="110" width="310" height="360" fill="#eff6ff" class="box"/><text x="75" y="150" class="head">Parent RDD</text>
<rect x="85" y="185" width="230" height="65" fill="#bfdbfe" class="box"/><text x="110" y="225" class="txt">Partition 0</text>
<rect x="85" y="275" width="230" height="65" fill="#bfdbfe" class="box"/><text x="110" y="315" class="txt">Partition 1</text>
<rect x="85" y="365" width="230" height="65" fill="#bfdbfe" class="box"/><text x="110" y="405" class="txt">Partition 2</text>
<path d="M325 217 L555 217 M325 307 L555 307 M325 397 L555 397" class="arrow"/>
<rect x="575" y="110" width="310" height="360" fill="#dcfce7" class="box"/><text x="605" y="150" class="head">Child RDD</text>
<rect x="615" y="185" width="230" height="65" fill="#bbf7d0" class="box"/><text x="640" y="225" class="txt">Partition 0</text>
<rect x="615" y="275" width="230" height="65" fill="#bbf7d0" class="box"/><text x="640" y="315" class="txt">Partition 1</text>
<rect x="615" y="365" width="230" height="65" fill="#bbf7d0" class="box"/><text x="640" y="405" class="txt">Partition 2</text>
<text x="930" y="225" class="head">No shuffle</text><text x="930" y="265" class="txt">P0 → P0</text><text x="930" y="305" class="txt">P1 → P1</text><text x="930" y="345" class="txt">P2 → P2</text><text x="930" y="405" class="small">Each child reads only</text><text x="930" y="430" class="small">its required parent data</text>

</svg>