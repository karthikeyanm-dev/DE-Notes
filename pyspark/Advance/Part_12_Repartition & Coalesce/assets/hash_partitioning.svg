<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<style>.title{font:bold 25px Arial;fill:#172033}.h{font:bold 18px Arial;fill:#1e293b}.t{font:16px Arial;fill:#334155}.key{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.part{fill:#dcfce7;stroke:#16a34a;stroke-width:2}</style>
<rect width="1000" height="520" fill="white"/><text x="500" y="45" text-anchor="middle" class="title">Conceptual hash partitioning by key</text>
<text x="500" y="90" text-anchor="middle" class="h">A key is mapped to a partition using a partition function</text>
<rect x="35" y="130" width="155" height="65" rx="9" class="key"/><text x="112" y="169" text-anchor="middle" class="h">Chennai</text><rect x="225" y="130" width="155" height="65" rx="9" class="key"/><text x="302" y="169" text-anchor="middle" class="h">Bangalore</text><rect x="415" y="130" width="155" height="65" rx="9" class="key"/><text x="492" y="169" text-anchor="middle" class="h">Mumbai</text><rect x="605" y="130" width="155" height="65" rx="9" class="key"/><text x="682" y="169" text-anchor="middle" class="h">Delhi</text><rect x="795" y="130" width="155" height="65" rx="9" class="key"/><text x="872" y="169" text-anchor="middle" class="h">Chennai</text><path d="M112 195 V235 H150 V275 M302 195 V235 H380 V275 M492 195 V235 H610 V275 M682 195 V235 H840 V275 M872 195 V235 H150 V275" stroke="#64748b" stroke-width="2" fill="none"/><rect x="55" y="275" width="190" height="95" rx="10" class="part"/><text x="150" y="315" text-anchor="middle" class="h">Partition 0</text><text x="150" y="345" text-anchor="middle" class="t">Assigned key(s)</text><rect x="290" y="275" width="190" height="95" rx="10" class="part"/><text x="385" y="315" text-anchor="middle" class="h">Partition 1</text><text x="385" y="345" text-anchor="middle" class="t">Assigned key(s)</text><rect x="525" y="275" width="190" height="95" rx="10" class="part"/><text x="620" y="315" text-anchor="middle" class="h">Partition 2</text><text x="620" y="345" text-anchor="middle" class="t">Assigned key(s)</text><rect x="760" y="275" width="190" height="95" rx="10" class="part"/><text x="855" y="315" text-anchor="middle" class="h">Partition 3</text><text x="855" y="345" text-anchor="middle" class="t">Assigned key(s)</text><text x="500" y="430" text-anchor="middle" class="t">Same key → same partition with a consistent hash partitioner</text><text x="500" y="465" text-anchor="middle" class="t">Hash partitioning does not guarantee equal record counts</text></svg>