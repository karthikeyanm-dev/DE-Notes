<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
 <style>
 .title{font:bold 28px Arial;fill:#0f172a} .head{font:bold 19px Arial;fill:#0f172a}
 .txt{font:16px Arial;fill:#1e293b} .small{font:14px Arial;fill:#475569}
 .box{stroke:#334155;stroke-width:2;rx:13} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="40" y="48" class="title">Spark output files and task partitions</text>

<rect x="45" y="115" width="300" height="320" fill="#eff6ff" class="box"/><text x="80" y="155" class="head">DataFrame</text><text x="85" y="220" class="txt">8 execution partitions</text><text x="85" y="275" class="txt">8 write tasks (typically)</text><text x="85" y="360" class="small">Some tasks may write</text><text x="85" y="385" class="small">no file for empty data</text>
<path d="M355 280 L455 280" class="arrow"/>
<rect x="475" y="115" width="260" height="320" fill="#fef3c7" class="box"/><text x="510" y="155" class="head">Write operation</text><text x="515" y="220" class="txt">Task writes output</text><text x="515" y="275" class="txt">Commit protocol</text><text x="515" y="360" class="small">File count depends on</text><text x="515" y="385" class="small">partitioning and writer</text>
<path d="M745 280 L845 280" class="arrow"/>
<rect x="865" y="115" width="290" height="320" fill="#dcfce7" class="box"/><text x="900" y="155" class="head">Output directory</text><text x="905" y="220" class="txt">part-000...</text><text x="905" y="275" class="txt">part-001...</text><text x="905" y="330" class="txt">part-002...</text><text x="905" y="385" class="small">Not always exactly one</text><text x="905" y="410" class="small">file per partition</text>

</svg>